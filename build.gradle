plugins {
    id 'java-library'
    id "io.qameta.allure" version "2.9.6"
}

group 'org.automationtestsaxpl'
version '1.0-SNAPSHOT'

def restAssuredVersion = "4.4.0",
    junitVersion = '5.8.2',
    assertJVersion = "3.22.0",
    allureVersion = "2.17.2",
    selenideVersion = "5.25.1"


allure {
    report {
        version.set('2.17.2')
    }

    adapter {
        autoconfigure.set(true)
        aspectjWeaver.set(true)
        frameworks {
            junit5 {
                adapterVersion.set('2.17.2')
            }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation (
            "org.junit.jupiter:junit-jupiter:$junitVersion",
            "io.rest-assured:rest-assured:$restAssuredVersion",
            "io.rest-assured:json-schema-validator:$restAssuredVersion",
            "org.assertj:assertj-core:$assertJVersion",
            "io.qameta.allure:allure-rest-assured:$allureVersion",
            "io.qameta.allure:allure-selenide:$allureVersion",
            "io.qameta.allure:allure-java-commons:$allureVersion",
            "com.codeborne:selenide:$selenideVersion",
            "com.github.javafaker:javafaker:1.0.2",
            "com.google.code.gson:gson:2.9.0",
            "javax.annotation:javax.annotation-api:1.3.2"
    )

    testRuntimeOnly (
            "org.junit.jupiter:junit-jupiter-engine:$junitVersion"
    )
}

tasks.withType(Test) {
    useJUnitPlatform()
    systemProperties(System.getProperties())

    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat "short"
        }
    }
}

task smoke_tests(type: Test) {
    useJUnitPlatform{
        includeTags "smoke"
    }
}

task order_tests(type: Test) {
    useJUnitPlatform{
        includeTags "order"
    }
}

task integration_tests(type: Test) {
    useJUnitPlatform{
        includeTags "integration"
    }
}